<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f3f0e4; font-family: "Lexend", sans-serif; position: relative; color: #2b2b28; }
  .c1 { position: absolute; width: 640px; height: 640px; border-radius: 50%; background: #788559; left: 800px; top: -240px; }
  .c2 { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: #dcd8c6; left: 720px; top: 470px; }
  .box { position: absolute; left: 850px; top: 150px; width: 200px; height: 200px; border-radius: 40px; background: #4f5b36; color: #f3f0e4; font-weight: 600; font-size: 84px; display: flex; align-items: center; justify-content: center; }
  .txt { position: absolute; left: 80px; top: 156px; width: 720px; }
  .pill { display: inline-block; border: 2px solid #6b7a4b; border-radius: 999px; padding: 8px 24px; font-size: 22px; color: #4f5b36; }
  h1 { margin-top: 30px; font-size: 64px; line-height: 1.15; font-weight: 600; }
  p { margin-top: 26px; font-size: 28px; line-height: 1.4; color: #5d5d55; }
</style></head>
<body>
  <div class="c1"></div><div class="c2"></div>
  <div class="box">NB</div>
  <div class="txt">
    <span class="pill">Nickolas Berg · Desenvolvedor</span>
    <h1>Sites, sistemas e automações com IA</h1>
    <p>Landing pages, sites, lojas virtuais e robôs de WhatsApp para o seu negócio.</p>
  </div>
</body></html>
